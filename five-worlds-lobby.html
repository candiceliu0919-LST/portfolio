<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KANKAN, VOL.30 — Worlds lobby prototype." />
    <title>KANKAN, VOL.30 — Worlds Lobby</title>
    <link rel="stylesheet" href="./src/styles/five-worlds-lobby.css?rev=03" />
    <link rel="preload" href="./public/fonts/kankan-voice/lxgw-wenkai-regular-site-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/styles/five-worlds-clarity.css?rev=03" />
    <link rel="stylesheet" href="./src/styles/chinese-voice.css?rev=02" />
    <link rel="stylesheet" href="./src/styles/production-color.css?rev=02" />
    <link rel="stylesheet" href="./src/styles/image-pass-v1.css?rev=01" />
    <link rel="stylesheet" href="./src/styles/world-consolidation-v1.css?rev=03" />
    <link rel="stylesheet" href="./src/styles/local-layout-fixes-v1.css?rev=09" />
    <link rel="stylesheet" href="./src/styles/final-assembly.css?rev=01" />
  </head>
  <body data-color-world="lobby">
    <main class="lobby" data-lobby>
      <div class="lobby__atmosphere" aria-hidden="true">
        <i class="lobby__wash lobby__wash--wine"></i>
        <i class="lobby__wash lobby__wash--moss"></i>
        <i class="lobby__beam"></i>
        <i class="lobby__grain"></i>
      </div>

      <header class="lobby__intro">
        <p>KANKAN, VOL.30 / CONTENTS</p>
        <h1>想认识我的话，<br />随便从一个地方进去。</h1>
        <span>04 PLACES / NO RECOMMENDED ORDER</span>
      </header>

      <nav class="world-scene" aria-label="The Worlds">
        <button
          class="world world--contradictions"
          type="button"
          data-world="contradictions"
          aria-label="CONTRADICTIONS ALLOWED — FIRST IMPRESSION, KEEP LOOKING"
        >
          <span class="world__number">01</span>
          <span class="contradiction-evidence" aria-hidden="true">
            <span class="contradiction-image contradiction-image--reason">
              <img src="./public/assets/image-pass-v1/contradictions-cool.webp" alt="" width="1400" height="2100" />
              <i>FIRST IMPRESSION</i>
            </span>
          </span>
          <span class="world__title world__title--contradictions">
            <b>CONTRADICTIONS</b>
            <i>ALLOWED</i>
          </span>
        </button>

        <button
          class="world world--keeping"
          type="button"
          data-world="keeping"
          aria-label="THINGS WORTH KEEPING — 散落的生活材料"
        >
          <span class="world__number"><b>02</b><small>/ KEPT FOR A REASON</small></span>
          <span class="kept-materials" aria-hidden="true">
            <span class="kept-photo kept-photo--artifact">
              <img src="./public/assets/interiors/things-worth-keeping/high-school-collaborative-story-display-v3.jpg" alt="" width="2400" height="1800" />
            </span>
            <span class="kept-photo kept-photo--note">
              <img src="./public/assets/image-pass-v1/keeping-diary-dialogue.webp" alt="" width="1200" height="1387" />
            </span>
          </span>
          <span class="keeping-label">
            <span class="world__title world__title--keeping">THINGS WORTH<br />KEEPING</span>
          </span>
        </button>

        <button
          class="world world--manual"
          type="button"
          data-world="manual"
          aria-label="KANKAN USER MANUAL — AI diagnostic preview"
        >
          <span class="world__number"><b>03</b><small>/ JOINTLY ISSUED</small></span>
          <span class="manual-diagnostic" aria-hidden="true">
            <span class="manual-diagnostic__bar">KANKAN OS v30.0 <i></i></span>
            <span class="manual-diagnostic__stamp">
              <small>STATUS</small>
              <strong>VERIFIED</strong>
            </span>
            <b>AI OFFICIAL RANKING™</b>
            <span>KNOWN BUGS <em>17</em></span>
            <span>UNEXPECTED FEATURES <em>???</em></span>
            <span class="manual-diagnostic__attachment">
              <img src="./public/assets/image-pass-v1/playground-kankan-ip.webp" alt="" width="240" height="240" />
              <small>EVIDENCE / 01</small>
            </span>
          </span>
          <span class="world__title world__title--manual">KANKAN<br />USER MANUAL</span>
        </button>

        <button
          class="world world--playground"
          type="button"
          data-world="playground"
          aria-label="PLAYGROUND — DO NOT PRESS"
        >
          <span class="world__number">04</span>
          <span class="playground-peek" aria-hidden="true">
            <img src="./public/assets/v1/sitong-1996.webp" alt="" width="1157" height="1056" />
          </span>
          <span class="world__title world__title--playground">PLAYGROUND</span>
          <span class="playground-switch" aria-hidden="true">
            <i></i>
            <b>DO NOT PRESS</b>
          </span>
        </button>
      </nav>

      <p class="lobby__status" data-lobby-status aria-live="polite">
        入口已经开着。随便选。
      </p>
      <a class="lobby__serious-link" href="./serious.html">SERIOUS MODE / SITONG LIU ↗</a>
      <div class="playground-witness" aria-hidden="true" data-playground-witness>👀</div>
    </main>
    <script type="module" src="./src/interactions/site-audio.js?rev=07"></script>
    <script type="module" src="./src/review/five-worlds-lobby.js?rev=10"></script>
  </body>
</html>
